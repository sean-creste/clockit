name: Deploy to Cloudflare Workers

# Auto-deploys the app to Cloudflare Workers on every push to main
# (i.e. when a PR is merged into main). Can also be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # NEXT_PUBLIC_* are inlined into the bundle at build time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm install` (not `npm ci`) so Linux-only optional native deps are
      # resolved on the runner — the lockfile was generated on macOS and omits
      # them, which makes `npm ci` fail on the CI platform.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Server-only secret the Worker reads at runtime (never inlined).
      - name: Set Worker runtime secret (service role)
        run: printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Build & deploy
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
